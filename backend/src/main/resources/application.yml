spring:
  application:
    name: telereleve
  config:
    # When run locally (mvnw spring-boot:run), read the repository's .env so local runs and
    # docker compose share one source of configuration. Real environment variables always win,
    # and the file is optional, so containers and CI are unaffected.
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:telereleve}
    username: ${POSTGRES_USER:telereleve}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  # SMTP server for alert e-mails: Mailpit in development (no authentication).
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_SMTP_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      # A mail server outage only delays notifications: it must not mark the backend as down
      # (Docker would then consider it unhealthy). Failed mails are logged by AlertMailNotifier.
      enabled: false
  endpoint:
    health:
      # Component names and status only (db: UP...), no connection details.
      show-components: always
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  default-produces-media-type: application/json

app:
  # MQTT ingestion of meter readings (see MqttConfig).
  mqtt:
    enabled: true
    url: ${MQTT_URL:tcp://localhost:${MQTT_PORT:1883}}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}
    # Fixed id: the broker keeps this client's persistent session and queues readings while it is down.
    client-id: ${MQTT_CLIENT_ID:telereleve-backend}
    topic: ceac/meters/+/readings
  anomaly:
    # Rule A3 (silent meters) is checked periodically for every active meter.
    schedule-interval: PT5M
    schedule-initial-delay: PT1M
  alerts:
    mail:
      enabled: ${ALERT_MAIL_ENABLED:true}
      from: telereleve@ceac.test
      to: ${ALERT_MAIL_TO:exploitation@ceac.test}
      platform-url: ${PLATFORM_URL:http://localhost:4200}
  # Demo meter park, used only by DevDataSeeder (dev profile).
  seed:
    meter-count: ${APP_SEED_METER_COUNT:50}
    water-share: 0.3
