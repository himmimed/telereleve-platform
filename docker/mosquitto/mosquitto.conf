# Mosquitto broker configuration for the Télérelève platform.
listener 1883

# Every client (backend, simulator) must authenticate.
allow_anonymous false
# Generated at container start from MQTT_USERNAME / MQTT_PASSWORD (see entrypoint.sh).
password_file /mosquitto/auth/passwd

# Keep QoS 1 messages queued for a disconnected persistent session across broker restarts.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
