# Mosquitto broker configuration for the Télérelève platform.
listener 1883

# Every client (backend, simulator) must authenticate.
allow_anonymous false
# Generated at container start from MQTT_USERNAME / MQTT_PASSWORD (see entrypoint.sh).
password_file /mosquitto/auth/passwd

# Keep QoS 1 messages queued for a disconnected persistent session across broker restarts.
persistence true
persistence_location /mosquitto/data/

# Mosquitto queues at most 1000 messages per client by default and silently drops the rest. With
# 1000 meters (1000 readings per minute) a one-minute backend outage would already lose readings, so
# the queue is sized for several hours of readings (docs/decisions.md, D22).
max_queued_messages 500000
max_inflight_messages 1000

log_dest stdout
log_type error
log_type warning
log_type notice
