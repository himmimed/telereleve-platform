# Télérelève platform - local / demo environment.
# Usage: copy .env.example to .env, then `docker compose up --build`.
# Passwords have no default on purpose: compose stops with a clear message if .env is missing.

name: ceac-telereleve

services:
  timescaledb:
    image: timescale/timescaledb:2.30.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telereleve}
      POSTGRES_USER: ${POSTGRES_USER:-telereleve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    entrypoint: ["sh", "/entrypoint.sh"]
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-telereleve}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?Set MQTT_PASSWORD in .env (see .env.example)}
    ports:
      - "${MQTT_PORT:-1883}:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./docker/mosquitto/entrypoint.sh:/entrypoint.sh:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      # An authenticated subscription to a broker system topic proves both liveness and auth.
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -u \"$${MQTT_USERNAME}\" -P \"$${MQTT_PASSWORD}\" -t '$$SYS/broker/uptime' -C 1 -W 3"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Mailpit: maintained drop-in replacement for MailHog (same ports). Catches every e-mail sent in dev.
  mailpit:
    image: axllent/mailpit:v1.31.5
    restart: unless-stopped
    ports:
      - "${MAIL_SMTP_PORT:-1025}:1025"
      - "${MAIL_UI_PORT:-8025}:8025"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      # dev profile: demo data (meters around Fès). Never use it in production.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      APP_SEED_METER_COUNT: ${APP_SEED_METER_COUNT:-50}
      POSTGRES_HOST: timescaledb
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-telereleve}
      POSTGRES_USER: ${POSTGRES_USER:-telereleve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      MQTT_URL: tcp://mosquitto:1883
      MQTT_USERNAME: ${MQTT_USERNAME:-telereleve}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?Set MQTT_PASSWORD in .env (see .env.example)}
      MAIL_HOST: mailpit
      MAIL_SMTP_PORT: 1025
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      APP_SEED_DEMO_PASSWORD: ${APP_SEED_DEMO_PASSWORD:-}
      SIMULATOR_PASSWORD: ${SIMULATOR_PASSWORD:?Set SIMULATOR_PASSWORD in .env (see .env.example)}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10

  simulator:
    build: ./simulator
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      MQTT_URL: tcp://mosquitto:1883
      MQTT_USERNAME: ${MQTT_USERNAME:-telereleve}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?Set MQTT_PASSWORD in .env (see .env.example)}
      BACKEND_URL: http://backend:8080
      SIM_BACKEND_USERNAME: simulateur
      SIM_BACKEND_PASSWORD: ${SIMULATOR_PASSWORD:?Set SIMULATOR_PASSWORD in .env (see .env.example)}
      SIM_INTERVAL_SECONDS: ${SIM_INTERVAL_SECONDS:-60}
      SIM_MAX_METERS: ${SIM_MAX_METERS:-0}
      # Demo scenario: 4 days of history, and one meter per anomaly type, started 25 h ago.
      SIM_BACKFILL_DAYS: ${SIM_BACKFILL_DAYS:-4}
      SIM_ANOMALIES: ${SIM_ANOMALIES-CEAC-E-000005:DECREASING_INDEX,CEAC-E-000008:VOLTAGE,CEAC-E-000011:SILENT,CEAC-E-000012:SPIKE,CEAC-W-000004:ZERO}
      SIM_ANOMALY_PERCENT: ${SIM_ANOMALY_PERCENT:-0}
      SIM_ANOMALY_DELAY_MINUTES: ${SIM_ANOMALY_DELAY_MINUTES:--1500}

volumes:
  timescale-data:
  mosquitto-data:
